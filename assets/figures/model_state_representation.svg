<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 360" role="img" aria-labelledby="title desc">
<title id="title">Comparison of three state representations</title><desc id="desc">The same latent state and two-action environment is represented by three agents with different retained ecological information.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs>
<rect x="20" y="22" width="1060" height="72" rx="14" fill="#eef4f4" stroke="#b5c8c8"/>
<text x="550" y="50" font-size="17" font-family="Arial" text-anchor="middle" fill="#17343a" font-weight="700">Shared environment (same for every agent)</text>
<text x="550" y="75" font-size="14" font-family="Arial" text-anchor="middle" fill="#17343a">Patch location + 3 resource levels + latent ecological phase + common reward/time dynamics</text>
<path d="M550 94 V120 H185 V145" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M550 120 V145" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M550 120 H915 V145" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="25" y="148" width="320" height="115" rx="12" fill="#f1edfa" stroke="#7d6bb2" stroke-width="1.5"/>
<text x="185" y="176" font-size="16" font-family="Arial" text-anchor="middle" font-weight="700" fill="#45366f">Zeraati-style event-free</text><text x="185" y="202" font-size="14" font-family="Arial" text-anchor="middle" fill="#45366f">(location, resources)</text><text x="185" y="224" font-size="13" font-family="Arial" text-anchor="middle" fill="#45366f">81 observations</text><text x="185" y="244" font-size="12" font-family="Arial" text-anchor="middle" fill="#45366f">No phase label or event cue</text>
<rect x="390" y="148" width="320" height="115" rx="12" fill="#fff4e5" stroke="#d08b36" stroke-width="1.5"/>
<text x="550" y="176" font-size="16" font-family="Arial" text-anchor="middle" font-weight="700" fill="#754a12">Event-blind</text><text x="550" y="202" font-size="14" font-family="Arial" text-anchor="middle" fill="#754a12">(location, resources, boundary cue)</text><text x="550" y="224" font-size="13" font-family="Arial" text-anchor="middle" fill="#754a12">243 observations</text><text x="550" y="244" font-size="12" font-family="Arial" text-anchor="middle" fill="#754a12">Onset cue is transient</text>
<rect x="755" y="148" width="320" height="115" rx="12" fill="#e6f5f3" stroke="#176b73" stroke-width="1.5"/>
<text x="915" y="176" font-size="16" font-family="Arial" text-anchor="middle" font-weight="700" fill="#10535a">Event-aware</text><text x="915" y="202" font-size="14" font-family="Arial" text-anchor="middle" fill="#10535a">(location, resources, persistent phase)</text><text x="915" y="224" font-size="13" font-family="Arial" text-anchor="middle" fill="#10535a">405 states</text><text x="915" y="244" font-size="12" font-family="Arial" text-anchor="middle" fill="#10535a">Explicit situation label</text>
<path d="M185 263 V286 H550 V305" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M550 263 V305" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M915 263 V286 H550" fill="none" stroke="#64748b" stroke-width="2"/>
<rect x="280" y="307" width="540" height="42" rx="10" fill="#17343a"/><text x="550" y="333" font-size="15" font-family="Arial" text-anchor="middle" fill="#ffffff" font-weight="700">Same two actions: EXPLOIT / LEAVE • Same average-reward objective</text>
</svg>